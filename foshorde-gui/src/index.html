<!DOCTYPE html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Foshorde</title>
    <link rel="icon" type="image/png" href="icons/png-transparent/foshorde-32x32.png" />
    <link rel="stylesheet" href="styles.css" />
    <!-- themes -->
    <link rel="stylesheet" href="themes/terminal.css" />
    <link rel="stylesheet" href="themes/paper.css" />
    <link rel="stylesheet" href="themes/brutal.css" />
    <link rel="stylesheet" href="themes/glass.css" />
    <link rel="stylesheet" href="themes/neon.css" />
    <link rel="stylesheet" href="themes/studio.css" />
    <link rel="stylesheet" href="themes/swiss.css" />
    <link rel="stylesheet" href="themes/retro.css" />
    <link rel="stylesheet" href="themes/blueprint.css" />
  </head>
  <body>
    <!-- Ambient particle field -->
    <canvas id="fx" aria-hidden="true"></canvas>
    <div class="spotlight" aria-hidden="true"></div>

    <!-- Titlebar -->
    <header class="titlebar" id="titlebar">
      <div class="brand">
        <img src="icons/png-transparent/foshorde-64x64.png" alt="" class="brand-logo" />
        <span class="brand-name">foshorde</span>
      </div>
      <nav class="title-actions">
        <button class="ico-btn" id="btn-toggle-theme" title="Theme (Ctrl+T)">
          <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3a9 9 0 1 0 0 18c1.1 0 1.6-.8 1.6-1.6 0-.5-.2-.9-.5-1.2-.3-.4-.5-.8-.5-1.3 0-.9.7-1.6 1.6-1.6H16a5 5 0 0 0 5-5c0-4-4-7.3-9-7.3z"/><circle cx="7.5" cy="11" r="1" fill="currentColor"/><circle cx="10.5" cy="7.5" r="1" fill="currentColor"/><circle cx="15" cy="8" r="1" fill="currentColor"/></svg>
        </button>
        <button class="ico-btn" id="btn-toggle-queue" title="Queue">
          <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h10"/></svg>
          <span class="badge" id="queue-badge"></span>
        </button>
        <button class="ico-btn" id="btn-toggle-settings" title="Settings">
          <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 7h9M17 7h3M4 17h3M11 17h9"/><circle cx="15" cy="7" r="2"/><circle cx="9" cy="17" r="2"/></svg>
        </button>
        <span class="title-sep"></span>
        <button class="ico-btn win" id="btn-win-minimize" title="Minimize">
          <svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M6 12h12"/></svg>
        </button>
        <button class="ico-btn win" id="btn-win-maximize" title="Maximize">
          <svg viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="6" y="6" width="12" height="12" rx="2"/></svg>
        </button>
        <button class="ico-btn win close" id="btn-win-close" title="Close">
          <svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M7 7l10 10M17 7L7 17"/></svg>
        </button>
      </nav>
    </header>

    <main class="stage" id="stage">

      <!-- ============ VIEW: DROP ============ -->
      <section class="view" id="view-drop" data-view="drop">
        <div class="drop-zone" id="drop-zone">
          <div class="orb" data-s>
            <span class="orb-ring r1"></span>
            <span class="orb-ring r2"></span>
            <span class="orb-ring r3"></span>
            <span class="orb-glow"></span>
            <img src="icons/png-transparent/foshorde-256x256.png" alt="Foshorde" class="orb-logo" />
          </div>
          <h1 class="drop-title" data-s><span class="t-idle">Drop a video</span><span class="t-over">Let go</span></h1>
          <p class="drop-sub" data-s>or <span class="link">browse files</span></p>
        </div>
        <div class="drop-foot" data-s>
          <span>MP4</span><span>MKV</span><span>MOV</span><span>AVI</span><span>WEBM</span><span>+15</span>
        </div>
      </section>

      <!-- ============ VIEW: EDIT ============ -->
      <section class="view" id="view-edit" data-view="edit">
        <div class="file-head" data-s>
          <div class="file-meta">
            <div class="file-name" id="file-name">—</div>
            <div class="file-sub" id="file-sub">—</div>
          </div>
          <button class="pill-btn" id="drop-bar-change" title="Add more videos">
            <svg viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
            Add
          </button>
        </div>

        <div class="hero" data-s>
          <div class="hero-nums">
            <div class="num-block">
              <span class="num-label">Original</span>
              <span class="num" id="sz-input">—</span>
            </div>
            <div class="hero-arrow" aria-hidden="true">
              <span></span><span></span><span></span>
            </div>
            <div class="num-block right">
              <span class="num-label">Output</span>
              <span class="num accent" id="sz-output">—</span>
            </div>
          </div>
          <div class="meter" id="meter">
            <div class="meter-fill" id="meter-fill"></div>
          </div>
          <div class="hero-note" id="sz-ratio">&nbsp;</div>
        </div>

        <div class="presets" data-s>
          <div class="presets-scroll" id="presets-scroll">
            <span class="chip-indicator" id="chip-indicator"></span>
            <div class="preset-grid" id="preset-grid"></div>
          </div>
        </div>

        <div class="custom-row" id="custom-row">
          <div class="custom-inner">
            <input type="range" id="custom-slider" min="1" max="99" value="25" />
            <span class="custom-pct" id="custom-pct">25%</span>
          </div>
        </div>

        <div class="action-row" data-s>
          <div class="out-group">
            <button class="out-btn" id="btn-out-folder" title="Choose output folder">
              <svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>
              <span id="out-folder-label">foshorde-output</span>
            </button>
            <button class="ico-btn sm" id="btn-open-out-folder" title="Open output folder">
              <svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M8 16L16 8M10 8h6v6"/></svg>
            </button>
          </div>
          <button class="go-btn" id="btn-start-action" disabled>
            <span class="go-label" id="start-btn-label">Compress</span>
            <span class="go-arrow" aria-hidden="true">
              <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
            </span>
          </button>
        </div>
      </section>

      <!-- ============ VIEW: RUN ============ -->
      <section class="view" id="view-run" data-view="run">
        <div class="press" data-s>
          <span class="shock"></span>
          <span class="shock s2"></span>
          <img src="icons/png-transparent/foshorde-128x128.png" alt="" class="press-logo" id="press-logo" />
        </div>
        <div class="run-pct" data-s>
          <span class="roller" id="run-roller"></span><span class="pct-sign">%</span>
        </div>
        <div class="run-track" data-s>
          <div class="run-fill" id="run-fill"><span class="run-head"></span></div>
        </div>
        <div class="run-stats" data-s>
          <span class="run-file" id="run-file">—</span>
          <span class="run-meta" id="run-meta">starting…</span>
        </div>
        <div class="run-dots" id="run-dots" data-s></div>
        <button class="text-btn" id="btn-cancel" data-s>Cancel</button>
      </section>

      <!-- ============ VIEW: DONE ============ -->
      <section class="view" id="view-done" data-view="done">
        <svg class="done-check" viewBox="0 0 64 64" data-s>
          <circle cx="32" cy="32" r="29" class="dc-ring" />
          <path d="M20 33l8 8 16-17" class="dc-tick" />
        </svg>
        <div class="done-big" data-s><span id="done-big">0</span></div>
        <div class="done-sub" data-s><span id="done-from">—</span><span class="done-sep">→</span><span id="done-to">—</span></div>
        <div class="done-saved" id="done-saved" data-s>&nbsp;</div>
        <div class="done-actions" data-s>
          <button class="pill-btn lg" id="btn-reveal">Show file</button>
          <button class="go-btn compact" id="btn-again"><span class="go-label">New video</span></button>
        </div>
      </section>
    </main>

    <!-- ============ DRAWER (queue / settings / new preset) ============ -->
    <div class="scrim" id="scrim"></div>
    <aside class="drawer" id="drawer">
      <!-- Queue -->
      <div class="panel" id="overlay-queue" data-panel="queue">
        <div class="panel-head">
          <h2>Queue</h2>
          <button class="text-btn sm" id="btn-clear-queue">Clear</button>
          <button class="ico-btn sm" data-close>
            <svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M7 7l10 10M17 7L7 17"/></svg>
          </button>
        </div>
        <div class="panel-body" id="queue-items-container"></div>
      </div>

      <!-- Theme -->
      <div class="panel" id="overlay-theme" data-panel="theme">
        <div class="panel-head">
          <h2>Theme</h2>
          <button class="ico-btn sm" data-close>
            <svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M7 7l10 10M17 7L7 17"/></svg>
          </button>
        </div>
        <div class="panel-body">
          <div class="theme-grid" id="theme-grid" data-p></div>
          <div class="theme-hint" data-p>Ctrl+T cycles themes</div>
        </div>
      </div>

      <!-- Settings -->
      <div class="panel" id="overlay-settings" data-panel="settings">
        <div class="panel-head">
          <h2>Settings</h2>
          <button class="ico-btn sm" data-close>
            <svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M7 7l10 10M17 7L7 17"/></svg>
          </button>
        </div>
        <div class="panel-body">
          <div class="field-label" data-p>Encoder</div>
          <div class="radio-list" id="encoder-options" data-p>
            <button class="radio selected" data-value="auto"><span class="dot"></span>Auto<em>GPU when available</em></button>
            <button class="radio" data-value="nvenc"><span class="dot"></span>NVIDIA<em>NVENC</em></button>
            <button class="radio" data-value="amf"><span class="dot"></span>AMD<em>AMF</em></button>
            <button class="radio" data-value="qsv"><span class="dot"></span>Intel<em>Quick Sync</em></button>
            <button class="radio" data-value="cpu"><span class="dot"></span>CPU<em>libx265</em></button>
          </div>

          <div class="field-label" data-p>System</div>
          <div class="kv" data-p>
            <div><span>FFmpeg</span><b id="status-ffmpeg">—</b></div>
            <div><span>Detected</span><b id="status-gpu">—</b></div>
          </div>

          <div class="panel-actions" data-p>
            <button class="pill-btn" id="btn-update-ffmpeg">
              <svg viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 12a8 8 0 1 1-2.3-5.6M20 4v5h-5"/></svg>
              Update FFmpeg
            </button>
            <button class="text-btn danger" id="btn-reset-all">Reset everything</button>
          </div>
        </div>
      </div>

      <!-- New preset -->
      <div class="panel" id="overlay-add-preset" data-panel="preset">
        <div class="panel-head">
          <h2>New preset</h2>
          <button class="ico-btn sm" data-close>
            <svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M7 7l10 10M17 7L7 17"/></svg>
          </button>
        </div>
        <div class="panel-body">
          <div class="field-label" data-p>Name</div>
          <div data-p>
            <input id="add-preset-name" class="line-input" type="text" placeholder="e.g. Email" maxlength="12" autocomplete="off" spellcheck="false" />
            <div id="add-preset-error" class="input-error"></div>
          </div>

          <div class="field-label" data-p>Target</div>
          <div class="seg" id="add-mode" data-p>
            <span class="seg-ind"></span>
            <button class="seg-btn active" id="add-mode-pct">Percent</button>
            <button class="seg-btn" id="add-mode-mb">Megabytes</button>
          </div>

          <div class="stepper" data-p>
            <button type="button" class="ico-btn" id="btn-stepper-minus">
              <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 12h12"/></svg>
            </button>
            <div class="stepper-val">
              <input id="add-preset-val" type="number" min="1" max="99" value="25" />
              <span id="add-preset-unit">%</span>
            </div>
            <button type="button" class="ico-btn" id="btn-stepper-plus">
              <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 6v12M6 12h12"/></svg>
            </button>
          </div>

          <button class="go-btn block" id="btn-confirm-add-preset" data-p><span class="go-label">Add preset</span></button>
        </div>
      </div>
    </aside>

    <!-- Toasts -->
    <div class="toasts" id="toast-container"></div>

    <!-- FFmpeg setup -->
    <div class="setup" id="overlay-ffmpeg-download">
      <button class="ico-btn sm setup-close" id="btn-close-dl-modal" title="Close">
        <svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M7 7l10 10M17 7L7 17"/></svg>
      </button>
      <div class="setup-inner">
        <img src="icons/png-transparent/foshorde-128x128.png" alt="" class="setup-logo" />
        <div class="setup-title">Setting up the engine</div>
        <div class="setup-sub" id="dl-status-text">Connecting…</div>
        <div class="setup-track"><div class="setup-fill" id="dl-fill"></div></div>
        <div class="setup-stats">
          <span id="dl-mb-text">0.0 / ~90 MB</span>
          <span id="dl-pct-text">0%</span>
          <span id="dl-speed-text">—</span>
        </div>
        <div class="setup-actions" id="dl-actions">
          <button class="pill-btn lg" id="btn-dl-offline">Continue</button>
          <button class="go-btn compact" id="btn-dl-retry"><span class="go-label">Retry</span></button>
        </div>
      </div>
    </div>

    <script src="main.js"></script>
  </body>
</html>
