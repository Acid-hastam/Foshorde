<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="foshorde icon">
  <title>foshorde</title>

  <defs>
    <clipPath id="clip-hammer-head">
      <rect x="216" y="52" width="80" height="148" rx="20" ry="20"/>
    </clipPath>
    <clipPath id="clip-hammer-handle">
      <path d="M 296 108 L 452 103 C 460 103 464 111 464 128 C 464 145 460 153 452 153 L 296 148 Z"/>
    </clipPath>
    <clipPath id="clip-hammer-nub">
      <rect x="197" y="106" width="22" height="44" rx="8" ry="8"/>
    </clipPath>
    <clipPath id="clip-blob-top">
      <path d="M 183 186 C 196 182 210 201 234 203 C 248 204 268 203 282 201 C 304 197 315 186 329 189 C 341 192 344 211 335 228 C 328 240 317 244 300 245 C 274 247 232 248 200 242 C 182 239 172 226 172 210 C 172 196 176 189 183 186 Z"/>
    </clipPath>
    <clipPath id="clip-blob-bottom">
      <path d="M 185 234 C 214 241 288 240 325 237 C 341 238 349 252 345 266 C 341 280 325 287 296 288 C 266 289 230 289 202 287 C 177 285 166 274 168 258 C 170 244 177 236 185 234 Z"/>
    </clipPath>
    <clipPath id="clip-anvil-body">
      <path d="M 52 288 L 334 288 L 334 382 C 324 396 327 416 348 430 C 357 436 364 440 366 445 L 146 445 C 148 440 155 436 164 430 C 185 416 188 396 178 382 C 166 362 142 342 96 332 L 58 324 C 52 322 50 306 52 288 Z"/>
    </clipPath>
    <clipPath id="clip-anvil-horn">
      <path d="M 334 297 L 361 297 L 361 304 L 458 304 C 462 304 463 310 458 318 C 440 346 396 369 334 375 Z"/>
    </clipPath>
  </defs>

  <!-- Centered vertically (top y=55, bottom y=457 -> center y=256) -->
  <g id="foshorde-mark" transform="translate(0, 9)">
    <!-- ==================== 1. ANVIL ==================== -->
    <!-- Anvil Horn (Right) -->
    <g id="anvil-horn">
      <g clip-path="url(#clip-anvil-horn)">
        <rect x="330" y="294" width="136" height="86" fill="#495a6e"/>
        <path d="M 334 297 L 460 304 L 446 313 C 415 316 375 316 334 314 Z" fill="#7c92a9"/>
        <path d="M 334 344 C 386 342 426 328 456 306 L 462 318 C 436 352 390 370 334 375 Z" fill="#394656"/>
      </g>
      <path d="M 334 297 L 361 297 L 361 304 L 457 304 C 462 304 463 310 458 318 C 440 346 396 369 334 375 Z"
            fill="none" stroke="#080b0f" stroke-width="11" stroke-linejoin="round" stroke-linecap="round"/>
      <line x1="361" y1="302" x2="361" y2="324" stroke="#080b0f" stroke-width="10" stroke-linecap="round"/>
    </g>

    <!-- Anvil Main Body & Smooth Pedestal Base (without bottom center arch/shadow) -->
    <g id="anvil-main">
      <g clip-path="url(#clip-anvil-body)">
        <rect x="46" y="284" width="336" height="168" fill="#495a6e"/>
        <!-- Top flat work-surface highlight -->
        <rect x="48" y="288" width="290" height="12" fill="#7c92a9"/>
        <!-- Left waist & foot curved rim highlight -->
        <path d="M 183 386 C 196 404 191 427 168 445 L 146 445 C 171 428 182 406 174 386 Z" fill="#7c92a9"/>
        <!-- Right waist & foot curved rim highlight -->
        <path d="M 329 386 C 316 404 321 427 344 445 L 366 445 C 341 428 330 406 338 386 Z" fill="#7c92a9"/>
      </g>

      <!-- Main Anvil Silhouette Outline (clean continuous flat bottom) -->
      <path d="M 52 288 L 334 288 L 334 382 C 324 396 327 416 348 430 C 357 436 365 440 366 445 L 146 445 C 147 440 155 436 164 430 C 185 416 188 396 178 382 C 166 362 142 342 96 332 L 58 324 C 52 322 50 306 52 288 Z"
            fill="none" stroke="#080b0f" stroke-width="11" stroke-linejoin="round" stroke-linecap="round"/>
    </g>

    <!-- ==================== 2. COMPRESSED BLUE OBJECT ==================== -->
    <g id="compressed-object">
      <!-- Bottom Fold Layer -->
      <g id="blob-bottom">
        <g clip-path="url(#clip-blob-bottom)">
          <rect x="164" y="230" width="186" height="62" fill="#2f467c"/>
          <!-- Bottom curved rim highlight -->
          <path d="M 169 264 C 184 278 216 281 256 281 C 296 281 328 277 343 262 L 346 289 L 166 289 Z" fill="#4264b8"/>
          <!-- Upper shadow cast by top fold -->
          <path d="M 176 232 C 214 249 286 249 334 236 L 338 250 C 290 259 216 259 174 246 Z" fill="#233669"/>
        </g>
        <path d="M 185 234 C 214 241 288 240 325 237 C 341 238 349 252 345 266 C 341 280 325 287 296 288 C 266 289 230 289 202 287 C 177 285 166 274 168 258 C 170 244 177 236 185 234 Z"
              fill="none" stroke="#080b0f" stroke-width="10.5" stroke-linejoin="round" stroke-linecap="round"/>
        <!-- Internal lower fold crease -->
        <path d="M 204 264 C 232 274 256 274 278 268 C 292 264 302 264 311 266"
              fill="none" stroke="#080b0f" stroke-width="6.5" stroke-linecap="round"/>
      </g>

      <!-- Top Fold Layer -->
      <g id="blob-top">
        <g clip-path="url(#clip-blob-top)">
          <rect x="168" y="180" width="178" height="70" fill="#496dd1"/>
          <!-- Top-left shoulder highlight -->
          <path d="M 173 206 C 175 192 183 186 194 190 C 206 194 218 204 242 205 C 260 205 276 204 288 201 L 284 210 C 262 213 236 214 216 209 C 198 204 188 196 181 203 C 178 207 177 214 178 220 Z" fill="#7fa3ee"/>
          <!-- Top-right shoulder highlight -->
          <path d="M 284 204 C 298 199 313 187 327 190 C 337 192 341 204 337 219 L 330 217 C 333 205 330 198 322 197 C 311 196 298 205 284 210 Z" fill="#7fa3ee"/>
          <!-- Lower fold shadow -->
          <path d="M 176 226 C 208 239 286 239 334 224 L 332 246 L 180 246 Z" fill="#3857b0"/>
        </g>
        <path d="M 183 186 C 196 182 210 201 234 203 C 248 204 268 203 282 201 C 304 197 315 186 329 189 C 341 192 344 211 335 228 C 328 240 317 244 300 245 C 274 247 232 248 200 242 C 182 239 172 226 172 210 C 172 196 176 189 183 186 Z"
              fill="none" stroke="#080b0f" stroke-width="10.5" stroke-linejoin="round" stroke-linecap="round"/>
        <!-- Internal top-right crease line -->
        <path d="M 256 217 C 274 214 294 212 310 214"
              fill="none" stroke="#080b0f" stroke-width="6.5" stroke-linecap="round"/>
        <!-- Deep diagonal pinch crease in center -->
        <path d="M 210 212 C 234 221 258 220 280 203"
              fill="none" stroke="#080b0f" stroke-width="7" stroke-linecap="round"/>
        <!-- Left & right pinch folds connecting top and bottom lobes -->
        <path d="M 184 233 C 198 236 212 240 225 245"
              fill="none" stroke="#080b0f" stroke-width="7" stroke-linecap="round"/>
        <path d="M 292 245 C 304 241 316 239 328 240"
              fill="none" stroke="#080b0f" stroke-width="7" stroke-linecap="round"/>
      </g>

      <!-- White Video Play Triangle in Center -->
      <path id="video-play-triangle"
            d="M 240 225.5 C 240 222.5 243.2 220.7 245.8 222.2 L 273.5 238.5 C 276.0 240.0 276.0 243.6 273.5 245.1 L 245.8 261.4 C 243.2 262.9 240 261.1 240 258.1 Z"
            fill="#ffffff"/>
    </g>

    <!-- ==================== 3. HAMMER ==================== -->
    <g id="hammer">
      <!-- Left Handle Nub -->
      <g id="hammer-nub">
        <g clip-path="url(#clip-hammer-nub)">
          <rect x="195" y="104" width="26" height="48" fill="#4b5c6e"/>
          <rect x="197" y="106" width="22" height="10" fill="#7c92a9"/>
          <rect x="197" y="140" width="22" height="12" fill="#3a4557"/>
        </g>
        <rect x="197" y="106" width="22" height="44" rx="8" ry="8"
              fill="none" stroke="#080b0f" stroke-width="10.5" stroke-linejoin="round"/>
      </g>

      <!-- Right Hammer Handle -->
      <g id="hammer-handle">
        <g clip-path="url(#clip-hammer-handle)">
          <rect x="294" y="100" width="174" height="56" fill="#4b5c6e"/>
          <path d="M 296 108 L 456 103 L 458 116 L 296 120 Z" fill="#7c92a9"/>
          <path d="M 296 136 L 462 138 L 458 153 L 296 148 Z" fill="#3a4557"/>
        </g>
        <path d="M 296 108 L 452 103 C 460 103 464 111 464 128 C 464 145 460 153 452 153 L 296 148 Z"
              fill="none" stroke="#080b0f" stroke-width="11" stroke-linejoin="round" stroke-linecap="round"/>
      </g>

      <!-- Vertical Hammer Head -->
      <g id="hammer-head">
        <g clip-path="url(#clip-hammer-head)">
          <rect x="214" y="50" width="84" height="152" fill="#4b5c6e"/>
          <path d="M 216 52 L 269 52 L 269 65 L 244 65 C 235 65 231 69 231 78 L 231 200 L 216 200 Z" fill="#7c92a9"/>
          <rect x="272" y="52" width="26" height="148" fill="#3a4557"/>
        </g>
        <rect x="216" y="52" width="80" height="148" rx="20" ry="20"
              fill="none" stroke="#080b0f" stroke-width="11" stroke-linejoin="round"/>
      </g>
    </g>
  </g>

</svg>
